<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E3A07C" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#C97D57" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#141514" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3A07C" />
      <stop offset="100%" stop-color="#C97D57" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E1E0DA" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#141514" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle grid / border lines -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1" />

  <!-- Brand Mark & Logo Top Center -->
  <g transform="translate(600, 200)">
    <!-- Logo Circle & Feather -->
    <g transform="translate(-32, -32) scale(0.0625)">
      <circle cx="512" cy="512" r="352" fill="none" stroke="url(#featherGrad)" stroke-width="40"/>
      <g transform="translate(512,512)">
        <path d="M -150,150 C -170,60 -140,-70 -20,-190 C 40,-250 120,-260 150,-250 C 160,-210 150,-130 90,-60 C 40,-2 -30,40 -70,90 C -90,115 -110,140 -150,150 Z" fill="url(#featherGrad)"/>
      </g>
    </g>
  </g>

  <!-- Brand Title -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#E3A07C" letter-spacing="4">THENVUE</text>

  <!-- Main Headline -->
  <text x="600" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="400" fill="url(#textGrad)" letter-spacing="-1">Your life, remembered.</text>

  <!-- Subtitle -->
  <text x="600" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#A1A09B" letter-spacing="0">Personal Memory &amp; AI Journal</text>

  <!-- Minimal Pill Tag at Bottom -->
  <g transform="translate(600, 490)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#D2D1CB">thenvue.com</text>
  </g>
</svg>